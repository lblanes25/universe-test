<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Universe Assurance Caseboard</title>
<style>
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-soft: #eef3f8;
  --ink: #1e293b;
  --muted: #64748b;
  --border: #d8e0ea;
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --red: #b91c1c;
  --red-soft: #fee2e2;
  --amber: #a16207;
  --amber-soft: #fef3c7;
  --green: #15803d;
  --green-soft: #dcfce7;
  --violet: #6d28d9;
  --violet-soft: #ede9fe;
  --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
button, input, select, textarea { font: inherit; }
button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
}
button:hover { border-color: #94a3b8; background: #f8fafc; }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.primary:hover { background: #1d4ed8; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
select, input[type="text"], textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 9px;
  background: var(--surface);
  color: var(--ink);
}
select:focus, input:focus, textarea:focus { outline: 2px solid var(--blue-soft); border-color: var(--blue); }
#app {
  height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand h1 { margin: 0; font-size: 18px; line-height: 1.15; }
.brand .sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
.counter { color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.counter b { color: var(--ink); }
.counter .gapn { color: var(--red); }

.board {
  min-height: 0;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 12px;
  padding: 12px;
}
.pane {
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.nav-pane { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.pane-head { padding: 11px; border-bottom: 1px solid var(--border); background: #fbfdff; }
.pane-title { margin: 0 0 9px; font-size: 13px; font-weight: 750; }
.filter-label {
  display: block; margin-bottom: 4px; color: var(--muted);
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px;
}
.nav-row-controls { margin-top: 9px; display: flex; align-items: center; gap: 6px; }
.nav-row-controls .pos { color: var(--muted); font-size: 11px; font-weight: 700; flex: 1; text-align: center; }
.nav-row-controls button { padding: 6px 9px; font-size: 12px; }
.action-row { display: flex; gap: 6px; margin-top: 8px; }
.action-row button { flex: 1; font-size: 12px; padding: 6px 8px; }

.case-list { min-height: 0; overflow-y: auto; padding: 8px; }
.case-row {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 9px; margin-bottom: 7px; cursor: pointer; background: var(--surface);
}
.case-row:hover { border-color: #94a3b8; }
.case-row.active { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); background: #f8fbff; }
.case-row-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.case-row-name { font-size: 12px; font-weight: 750; line-height: 1.25; }
.case-row-path { margin-top: 2px; color: var(--muted); font-size: 10.5px; font-family: Consolas, "SFMono-Regular", monospace; }
.dot { width: 9px; height: 9px; border-radius: 999px; flex: none; margin-top: 4px; border: 1.5px solid var(--border); background: transparent; }
.dot.real { background: var(--green); border-color: var(--green); }
.dot.noise { background: #94a3b8; border-color: #94a3b8; }
.dot.needs-info { background: var(--amber); border-color: var(--amber); }
.badge-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.badge {
  display: inline-flex; align-items: center; min-height: 19px; border-radius: 999px;
  padding: 2px 7px; font-size: 10px; font-weight: 700; white-space: nowrap;
}
.badge.gap { color: var(--red); background: var(--red-soft); }
.badge.doc { color: var(--amber); background: var(--amber-soft); }
.badge.ok { color: var(--green); background: var(--green-soft); }
.badge.info { color: var(--blue); background: var(--blue-soft); }
.badge.risk { color: var(--violet); background: var(--violet-soft); }
.badge.muted { color: var(--muted); background: var(--surface-soft); }

.case-pane { min-height: 0; overflow-y: auto; }
.case-head { padding: 16px 18px 13px; border-bottom: 1px solid var(--border); }
.case-eyebrow { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.case-title { margin: 5px 0 0; font-size: 21px; line-height: 1.25; font-weight: 760; }
.case-title b { color: var(--blue); }
.case-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }

.story-explain {
  margin: 14px 18px 0; padding: 11px 13px;
  border: 1px solid var(--border); border-left: 3px solid var(--blue);
  border-radius: 9px; background: var(--surface-soft);
  font-size: 12px; line-height: 1.5;
}
.story-explain .how { margin-top: 6px; color: var(--muted); }
.story-explain b { color: var(--ink); }
.story-col details.story-more { margin-top: 9px; }
.story-col details.story-more > summary { cursor: pointer; font-size: 10.5px; color: var(--muted); list-style: none; }
.story-col details.story-more > summary::-webkit-details-marker { display: none; }
.story-col details.story-more > summary::before { content: "\25B8  "; }
.story-col details.story-more[open] > summary::before { content: "\25BE  "; }
.story-col details.story-more .more-body { margin-top: 6px; }
.story { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 14px 18px; }
.story-col { border: 1px solid var(--border); border-radius: 9px; padding: 12px; background: #fbfdff; min-width: 0; }
.story-col.orphaned { border-color: #fecaca; background: #fff7f7; }
.story-col h3 {
  margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
}
.story-col.transferred h3 { color: var(--blue); }
.story-col.covered h3 { color: var(--amber); }
.story-col.orphaned h3 { color: var(--red); }
.story-col .sub { margin: 0 0 9px; color: var(--muted); font-size: 10px; }
.story-prose { margin: 0 0 9px; font-size: 12px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
.story-prose.muted { color: var(--muted); font-style: italic; }
.story-reason { font-size: 13.5px; line-height: 1.55; color: var(--ink); }
.risk-line { font-size: 11.5px; line-height: 1.4; margin-bottom: 6px; overflow-wrap: anywhere; }
.risk-line code { color: var(--violet); font-family: Consolas, "SFMono-Regular", monospace; font-size: 10.5px; }
.control-item { border: 1px solid var(--border); border-radius: 7px; padding: 7px 8px; margin-bottom: 6px; background: #fff; }
.control-item .ct-title { font-size: 11.5px; font-weight: 700; line-height: 1.3; }
.control-item .ct-desc { margin-top: 3px; color: var(--muted); font-size: 10.5px; line-height: 1.4; }
.control-item .ct-tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
.tag { font-size: 9.5px; font-family: Consolas, monospace; color: var(--muted); background: var(--surface-soft); border-radius: 5px; padding: 1px 5px; }
.more-note { color: var(--muted); font-size: 10.5px; margin-top: 4px; }

.action-card { margin: 0 18px 14px; border: 1px solid var(--border); border-radius: 9px; padding: 13px 14px; background: var(--surface-soft); }
.action-card .now-what { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
.action-card .act-title { margin: 4px 0 0; font-size: 15px; font-weight: 750; }
.action-card ul { margin: 8px 0 0; padding-left: 18px; }
.action-card li { font-size: 12px; line-height: 1.5; color: #334155; margin-bottom: 3px; }
.decision-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: none; border-right: 1px solid var(--border); border-radius: 0; padding: 6px 11px; font-size: 11.5px; background: var(--surface); }
.seg button:last-child { border-right: none; }
.seg button.on.real { background: var(--green-soft); color: var(--green); font-weight: 750; }
.seg button.on.noise { background: var(--surface); color: var(--ink); font-weight: 750; box-shadow: inset 0 0 0 1px #94a3b8; }
.seg button.on.needs { background: var(--amber-soft); color: var(--amber); font-weight: 750; }
.decision-row .dec-field { flex: 1; min-width: 130px; }
.decision-row .dec-field input { padding: 6px 8px; font-size: 12px; }
.dec-saved { color: var(--green); font-size: 10.5px; }

.detail-block { margin: 0 18px 16px; }
details.evidence { border: 1px solid var(--border); border-radius: 9px; background: #fbfdff; }
details.evidence > summary { cursor: pointer; padding: 11px 13px; font-size: 12px; font-weight: 700; color: var(--ink); list-style: none; }
details.evidence > summary::-webkit-details-marker { display: none; }
details.evidence > summary::before { content: "▸ "; color: var(--muted); }
details.evidence[open] > summary::before { content: "▾ "; }
.evidence-body { padding: 0 13px 13px; }
.evidence-block { border: 1px solid var(--border); border-radius: 8px; padding: 11px; background: #fff; margin-top: 10px; min-width: 0; }
.block-title { margin: 0 0 7px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.45px; }
.block-text { margin: 0; color: var(--ink); font-size: 12px; line-height: 1.48; overflow-wrap: anywhere; }
.quote { border-left: 3px solid var(--blue); padding-left: 9px; color: #334155; font-style: italic; }
.finding-mini { border: 1px solid var(--border); border-radius: 7px; padding: 8px; margin-top: 7px; background: #fff; }
.finding-mini .fm-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.finding-mini .fm-reason { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.entity-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 10px; background: #fff; }
.entity-box h3 { margin: 0; font-size: 12px; line-height: 1.25; }
.entity-box .entity-id { color: var(--muted); font-size: 10.5px; font-family: Consolas, "SFMono-Regular", monospace; margin-top: 2px; }
.status-line { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 9px; }
.metric { border: 1px solid var(--border); border-radius: 7px; padding: 7px; background: #fbfdff; }
.metric .m-label { color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.35px; }
.metric .m-val { margin-top: 2px; font-weight: 750; font-size: 12px; overflow-wrap: anywhere; }
.empty { padding: 28px; color: var(--muted); text-align: center; font-size: 13px; }

@media (max-width: 1050px) {
  body { overflow: auto; height: auto; }
  #app { height: auto; min-height: 100vh; }
  .topbar { align-items: flex-start; flex-direction: column; }
  .board { grid-template-columns: 1fr; }
  .pane { min-height: 360px; }
  .nav-pane { min-height: 420px; }
  .story { grid-template-columns: 1fr; }
}

/* Embedded in the dashboard drawer: the map is the navigator, so show only the
   single case detail — full height, scrolling — and drop the list, filters, and
   topbar. These selectors out-specify the max-width:1050px rules above so the
   narrow drawer never falls back to the list-first mobile stack. */
body.embedded, body.embedded #app { height: 100vh; overflow: hidden; }
body.embedded #app { grid-template-rows: 1fr; }
body.embedded .topbar { display: none; }
body.embedded .nav-pane { display: none; }
body.embedded .board { grid-template-columns: 1fr; padding: 10px; gap: 0; min-height: 0; }
body.embedded .case-pane { min-height: 0; height: 100%; overflow-y: auto; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Audit Universe Assurance Caseboard</h1>
      <div class="sub" id="generated-at"></div>
    </div>
    <div class="counter" id="counter"></div>
  </header>

  <main class="board">
    <section class="pane nav-pane">
      <div class="pane-head">
        <h2 class="pane-title">Cases</h2>
        <div>
          <label class="filter-label" for="classification-filter">Classification</label>
          <select id="classification-filter"></select>
        </div>
        <div style="margin-top:9px;">
          <label class="filter-label" for="search-input">Search entity / case</label>
          <input type="text" id="search-input" placeholder="AE-22">
        </div>
        <div class="nav-row-controls">
          <button id="nav-prev">Prev</button>
          <span class="pos" id="nav-pos"></span>
          <button id="nav-next">Next</button>
        </div>
        <div class="action-row">
          <button id="export-csv">Export CSV</button>
          <button id="reset-view">Reset</button>
        </div>
      </div>
      <div class="case-list" id="case-list"></div>
    </section>

    <section class="pane case-pane" id="case-pane">
      <div class="case-head" id="case-head"></div>
      <div id="case-story"></div>
      <div id="case-action"></div>
      <div class="detail-block" id="case-evidence"></div>
    </section>
  </main>
</div>

<script>
%%DATA_INJECTION%%

const cases = DATA.cases || [];
const findingsById = {};
(DATA.findings || []).forEach(f => { findingsById[f.id] = f; });

const defaultClassification = (DATA.summary && DATA.summary.classifications && DATA.summary.classifications['likely coverage gap']) ? 'likely coverage gap' : 'all';
const state = {
  classification: defaultClassification,
  query: '',
  selectedCaseKey: null
};
let externalLoad = false;   // a #case=... deep link on first load may relax the filter

const classificationFilter = document.getElementById('classification-filter');
const searchInput = document.getElementById('search-input');

const DECISION_KEY = 'caseboard.decisions.v1';
function loadDecisions() { try { return JSON.parse(localStorage.getItem(DECISION_KEY)) || {}; } catch (e) { return {}; } }
function saveDecision(k, patch) {
  const all = loadDecisions();
  all[k] = Object.assign({ status: '', owner: '', note: '', ts: '' }, all[k], patch, { ts: new Date().toISOString() });
  try { localStorage.setItem(DECISION_KEY, JSON.stringify(all)); } catch (e) {}
}
function decisionFor(k) { return loadDecisions()[k] || { status: '', owner: '', note: '', ts: '' }; }

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}
function label(value) {
  const text = String(value || '').trim();
  return text ? text.charAt(0).toUpperCase() + text.slice(1) : '';
}
// Plain-language review kind — no "Task 3/5" jargon ever reaches the auditor.
function reviewKind(task) {
  const t = Number(task);
  if (t === 5) return { label: 'Cross-entity handoff', blurb: 'Receiver may not cover this risk' };
  if (t === 3) return { label: 'Embedded control', blurb: 'May have no named owner' };
  if (t === 1) return { label: 'Documentation conformance', blurb: '' };
  if (t === 2) return { label: 'Rating consistency', blurb: '' };
  if (t === 4) return { label: 'Entity alignment', blurb: '' };
  return { label: 'Review', blurb: '' };
}
// Controlled Stage-1 requirement themes (mirror config/stage2_prompt.yaml `requirements`).
const REQ_LABELS = {
  risk_ownership: 'Explicit risk ownership',
  attribute_documentation: 'Attribute-level handoff doc',
  coarse_handoff: 'Coarse-handoff boundary',
  handoff_hygiene: 'Handoff hygiene',
  assurance_map: 'Assurance map',
  other: 'Other / unmapped'
};
function reqLabel(id) {
  if (!id) return '';
  return REQ_LABELS[id] || id;
}
function classKind(value) {
  const v = String(value || '').toLowerCase();
  if (v.includes('coverage gap')) return 'gap';
  if (v.includes('documentation')) return 'doc';
  if (v.includes('conforms')) return 'ok';
  return 'muted';
}
function riskKind(value) {
  const v = String(value || '').toLowerCase();
  if (v === 'critical' || v === 'high') return 'gap';
  if (v === 'medium') return 'doc';
  if (v === 'low') return 'ok';
  return 'muted';
}
function chipHtml(text, kind) {
  return text ? `<span class="badge ${kind || 'muted'}">${esc(text)}</span>` : '';
}
function optionHtml(value, text) { return `<option value="${esc(value)}">${esc(text)}</option>`; }

function initControls() {
  const classes = DATA.filters.classifications || [];
  const opts = [optionHtml('all', 'All classifications')];
  classes.forEach(v => opts.push(optionHtml(v, label(v))));
  classificationFilter.innerHTML = opts.join('');
  classificationFilter.value = state.classification;
  classificationFilter.addEventListener('change', () => { state.classification = classificationFilter.value; renderAll(); });
  searchInput.addEventListener('input', () => { state.query = searchInput.value.trim().toLowerCase(); renderAll(); });
}

function caseHaystack(c) {
  return [c.caseKey, c.sourceId, c.sourceName, c.targetId, c.targetName].join(' ').toLowerCase();
}
function filteredCases() {
  return cases.filter(c => {
    if (state.classification !== 'all' && c.classification !== state.classification) return false;
    if (state.query && !caseHaystack(c).includes(state.query)) return false;
    return true;
  });
}
function selectedCase(list) {
  if (!list.length) { state.selectedCaseKey = null; return null; }
  let current = list.find(c => c.caseKey === state.selectedCaseKey);
  if (!current) { current = list[0]; state.selectedCaseKey = current.caseKey; }
  return current;
}

function riskGist(c) {
  const kr = (c.keyRisks || []).find(r => r.description && r.description !== r.id);
  if (kr) return kr.description;
  return c.riskCategory && c.riskCategory !== 'Unspecified' ? c.riskCategory : 'this risk';
}

function renderCounter(list) {
  const gaps = cases.filter(c => c.classification === 'likely coverage gap').length;
  const showing = list.length;
  document.getElementById('counter').innerHTML =
    `<b>${showing}</b> of ${cases.length} cases shown · <span class="gapn"><b>${gaps}</b> likely gaps</span>`;
}

function caseRowHtml(c) {
  const active = c.caseKey === state.selectedCaseKey ? ' active' : '';
  const target = c.targetId ? `${c.targetId} ${c.targetName || ''}` : 'Entity-local';
  const dec = decisionFor(c.caseKey);
  const dotCls = dec.status ? ' ' + dec.status.replace(' ', '-') : '';
  const rk = reviewKind(c.task).label;
  const n = c.findingCount > 1 ? ` <span class="badge muted">${c.findingCount} findings</span>` : '';
  return `
    <div class="case-row${active}" data-key="${esc(c.caseKey)}">
      <div class="case-row-top">
        <div>
          <div class="case-row-name">${esc(c.sourceName || c.sourceId)}</div>
          <div class="case-row-path">${esc(c.sourceId)} &rarr; ${esc(target)}</div>
        </div>
        <span class="dot${dotCls}" title="${esc(dec.status || 'no decision')}"></span>
      </div>
      <div class="badge-row">
        <span class="badge ${classKind(c.classification)}">${esc(label(c.classification))}</span>
        <span class="badge info">${esc(rk)}</span>
        <span class="badge risk">${esc(c.riskCategory || 'Unspecified')}</span>${n}
      </div>
    </div>`;
}

function renderNav(list) {
  const root = document.getElementById('case-list');
  if (!list.length) { root.innerHTML = '<div class="empty">No cases match the current filters.</div>'; }
  else { root.innerHTML = list.map(caseRowHtml).join(''); }
  root.querySelectorAll('.case-row').forEach(row => {
    row.addEventListener('click', () => { state.selectedCaseKey = row.dataset.key; renderAll(); });
  });
  const idx = list.findIndex(c => c.caseKey === state.selectedCaseKey);
  document.getElementById('nav-pos').textContent = list.length ? `${idx >= 0 ? idx + 1 : 0} / ${list.length}` : '0 / 0';
  document.getElementById('nav-prev').disabled = list.length < 2;
  document.getElementById('nav-next').disabled = list.length < 2;
}

function caseHeadline(c) {
  const head = document.getElementById('case-head');
  if (!c) { head.innerHTML = '<div class="empty">No case selected.</div>'; return; }
  const rk = reviewKind(c.task);
  const src = `${esc(c.sourceId)} ${esc(c.sourceName || '')}`.trim();
  let sentence;
  if (c.caseHeadline) {
    // LLM-authored, entity- and handoff-specific (preferred when present).
    sentence = esc(c.caseHeadline);
  } else if (c.task === 5) {
    const tgt = c.targetId ? `${esc(c.targetId)} ${esc(c.targetName || '')}`.trim() : 'an unnamed downstream owner';
    const area = (c.riskCategory && c.riskCategory !== 'Unspecified') ? esc(c.riskCategory) : 'a risk';
    sentence = `${src} handed off <b>${area}</b> to ${tgt}.`;
  } else if (c.task === 3) {
    const area = (c.riskCategory && c.riskCategory !== 'Unspecified') ? esc(c.riskCategory) : 'a control area';
    sentence = `${src} handed off <b>${area}</b> at the program level — the embedded control may be owned by no one.`;
  } else {
    const area = (c.riskCategory && c.riskCategory !== 'Unspecified') ? esc(c.riskCategory) : 'this area';
    sentence = `${src} — ${esc(rk.label.toLowerCase())} for <b>${area}</b>.`;
  }
  const target = c.targetId ? `${c.targetId} ${c.targetName || ''}` : 'Entity-local review';
  head.innerHTML = `
    <div class="case-eyebrow">${esc(rk.label)}${rk.blurb ? ' · ' + esc(rk.blurb) : ''}</div>
    <h2 class="case-title">${sentence}</h2>
    <div class="case-meta">
      ${chipHtml(label(c.classification), classKind(c.classification))}
      ${chipHtml(c.riskCategory, 'risk')}
      ${c.requirementId ? chipHtml(reqLabel(c.requirementId), 'muted') : ''}
      ${chipHtml(target, 'info')}
      ${c.findingCount > 1 ? chipHtml(c.findingCount + ' findings', 'muted') : ''}
      ${c.gatePassed ? '' : chipHtml('Gate flagged', 'doc')}
    </div>`;
}

// Shared with renderStoryTask3 — one <div class="risk-line"> per resolved ID.
function riskLinesHtml(items) {
  return (items || []).map(r =>
    r.description && r.description !== r.id
      ? `<div class="risk-line"><code>${esc(r.id)}</code> — ${esc(r.description)}</div>`
      : `<div class="risk-line"><code>${esc(r.id)}</code></div>`
  ).join('');
}
function controlItemsHtml(c) {
  const items = (c.coveringControls || []).map(ct => `
    <div class="control-item">
      <div class="ct-title">${esc(ct.title || ct.controlId || 'Untitled control')}</div>
      ${ct.description ? `<div class="ct-desc">${esc(ct.description)}</div>` : ''}
      <div class="ct-tags">
        ${ct.controlId ? `<span class="tag">${esc(ct.controlId)}</span>` : ''}
        ${ct.srId ? `<span class="tag">${esc(ct.srId)}</span>` : ''}
        ${ct.kpaId ? `<span class="tag">${esc(ct.kpaId)}</span>` : ''}
      </div>
    </div>`).join('');
  if (!items) return '';
  const more = (c.coveringControlsTotal || 0) > (c.coveringControls || []).length
    ? `<div class="more-note">Showing ${(c.coveringControls || []).length} of ${c.coveringControlsTotal} matching controls.</div>` : '';
  return items + more;
}

// Collapsible "supporting evidence" block inside a story column. Returns '' when empty.
function storyMore(summary, bodyHtml) {
  return bodyHtml
    ? `<details class="story-more"><summary>${esc(summary)}</summary><div class="more-body">${bodyHtml}</div></details>`
    : '';
}
// Risk statements + KPA lines, for the collapsible evidence drawer.
function riskEvidenceHtml(c) {
  const risks = riskLinesHtml(c.keyRisks);
  const kpas = riskLinesHtml((c.kpas || []).filter(k => k.description && k.description !== k.id));
  return (risks + kpas) || '';
}
// Raw SR/KPA ids as the literal pointer, for the collapsible evidence drawer.
function pointerIdsHtml(c) {
  const ids = [...(c.specificRiskIds || []), ...(c.kpaIds || [])];
  return ids.length ? ids.map(id => `<code>${esc(id)}</code>`).join(' ') : '';
}

// Task 3 = embedded control (entity-local, no named receiver). Lead each column with the
// LLM-authored narrative when present; otherwise fall back to plainer field-stitched text.
// Raw evidence (risk statements, cited quote, IDs, own controls) is demoted to collapsibles.
function renderStoryTask3(c) {
  const area = (c.riskCategory && c.riskCategory !== 'Unspecified') ? c.riskCategory : 'this risk';
  const srcName = c.sourceName || c.sourceId;
  const hasN = c.caseHeadline || c.transferredSummary || c.coverageSummary || c.pointingAt;

  // Short, generic definition only — the entity-specific story now lives in the narrative fields.
  const explainer = `
    <div class="story-explain">
      <div class="what"><b>Embedded-control gap:</b> a risk handed up to a program/functional audit
        is owned there at the framework level, while the hands-on control inside this entity's own
        process can end up owned by no one.</div>
    </div>`;

  // Handed off (program level).
  const transferredLead = c.transferredSummary
    ? `<p class="story-prose">${esc(c.transferredSummary)}</p>`
    : `<p class="story-prose"><b>${esc(area)}</b> was pushed up to a program/functional audit.</p>`;
  const transferred = `
    <div class="story-col transferred">
      <h3>Handed off (program level)</h3>
      <p class="sub">What ${esc(c.sourceId)} pushed up to a program/functional audit</p>
      ${transferredLead}
      ${storyMore('Risk statements behind this', riskEvidenceHtml(c))}
    </div>`;

  // Covered there. No hardcoded framework claim — lead with the model's read of the coverage,
  // and put the actual cited quote behind a drawer (it is often specific, not "framework").
  const coveredLead = c.coverageSummary
    ? `<p class="story-prose">${esc(c.coverageSummary)}</p>`
    : `<p class="story-prose muted">Program/functional coverage for ${esc(area)} sits in another audit; what it actually tests is in the cited evidence below.</p>`;
  const covered = `
    <div class="story-col covered">
      <h3>Covered there</h3>
      <p class="sub">What the program side does</p>
      ${coveredLead}
      ${storyMore('Cited evidence', c.evidenceQuote ? `<p class="story-prose quote">${esc(c.evidenceQuote)}</p>` : '')}
    </div>`;

  // Orphaned here — the model's read leads; pointer + IDs + own-controls demoted.
  const pointer = c.pointingAt
    ? `<p class="story-prose" style="margin-top:9px;"><b>Pointing at:</b> ${esc(c.pointingAt)}</p>`
    : `<p class="story-prose" style="margin-top:9px;"><b>Pointing at:</b> the embedded-process control for ${esc(area)} inside ${esc(srcName)}.</p>`;
  const controls = controlItemsHtml(c)
    || `<p class="story-prose muted">Nothing in this entity's own controls tests this slice.</p>`;
  const orphaned = `
    <div class="story-col orphaned">
      <h3>Orphaned here (embedded)</h3>
      <p class="sub">The model's read</p>
      <div style="margin-bottom:8px;">${chipHtml(label(c.classification), classKind(c.classification))}</div>
      <div class="story-reason">${esc(c.reasoning || 'No reasoning recorded.')}</div>
      ${pointer}
      ${storyMore('What we mean (IDs + this entity’s own controls)',
          (pointerIdsHtml(c) ? `<div class="risk-line">${pointerIdsHtml(c)}</div>` : '')
          + `<p class="sub" style="margin:8px 0 4px;">What ${esc(srcName)} still tests for ${esc(area)}</p>` + controls)}
    </div>`;

  return explainer + `<div class="story">${transferred}${covered}${orphaned}</div>`;
}

function renderStory(c) {
  const root = document.getElementById('case-story');
  if (!c) { root.innerHTML = ''; return; }
  if (c.task === 3) { root.innerHTML = renderStoryTask3(c); return; }
  const source = c.source || {};
  const target = c.target || null;

  // TRANSFERRED — lead with the LLM summary; demote the raw handoff prose + risk statements.
  const srcProse = source.handoffDesc || source.overview || '';
  const transferredLead = c.transferredSummary
    ? `<p class="story-prose">${esc(c.transferredSummary)}</p>`
    : `<p class="story-prose${srcProse ? '' : ' muted'}">${esc(srcProse) || 'No hand-off description on file.'}</p>`;
  const transferredMore = storyMore('Hand-off description & risk statements',
    (c.transferredSummary && srcProse ? `<p class="story-prose">${esc(srcProse)}</p>` : '') + riskEvidenceHtml(c));
  const transferred = `
    <div class="story-col transferred">
      <h3>Transferred</h3>
      <p class="sub">What ${esc(c.sourceId)} handed off</p>
      ${transferredLead}
      ${transferredMore}
    </div>`;

  // COVERED — lead with the LLM read of what the receiver covers + the matching controls (the real
  // "what they test"); the receiver's profile prose + cited quote move behind a drawer so they no
  // longer masquerade as tested controls.
  const recvName = target ? `${target.id} ${target.name || ''}` : c.sourceId;
  const recvProse = target ? (target.handoffDesc || target.overview || '') : (source.handoffDesc || source.overview || '');
  const controls = controlItemsHtml(c);
  const coveredLead = c.coverageSummary
    ? `<p class="story-prose">${esc(c.coverageSummary)}</p>`
    : (controls ? '' : `<p class="story-prose muted">No control in the export touches this risk area.</p>`);
  const coveredMore = storyMore('Receiver profile & cited evidence',
    (recvProse ? `<p class="story-prose">${esc(recvProse)}</p>` : '')
    + (c.evidenceQuote ? `<p class="story-prose quote">${esc(c.evidenceQuote)}</p>` : ''));
  const covered = `
    <div class="story-col covered">
      <h3>Covered</h3>
      <p class="sub">What ${esc(recvName.trim())} actually tests</p>
      ${coveredLead}
      ${controls}
      ${coveredMore}
    </div>`;

  // ORPHANED — the model's read; pointer + raw IDs demoted.
  const pointer = c.pointingAt
    ? `<p class="story-prose" style="margin-top:9px;"><b>Pointing at:</b> ${esc(c.pointingAt)}</p>` : '';
  const orphaned = `
    <div class="story-col orphaned">
      <h3>Orphaned</h3>
      <p class="sub">The model's read</p>
      <div style="margin-bottom:8px;">${chipHtml(label(c.classification), classKind(c.classification))}</div>
      <div class="story-reason">${esc(c.reasoning || 'No reasoning recorded.')}</div>
      ${pointer}
      ${storyMore('Risk IDs', pointerIdsHtml(c) ? `<div class="risk-line">${pointerIdsHtml(c)}</div>` : '')}
    </div>`;

  root.innerHTML = `<div class="story">${transferred}${covered}${orphaned}</div>`;
}

function renderAction(c) {
  const root = document.getElementById('case-action');
  if (!c) { root.innerHTML = ''; return; }
  const a = c.recommendedAction || { title: 'Review and triage', steps: [] };
  const steps = (a.steps || []).map(s => `<li>${esc(s)}</li>`).join('');
  const dec = decisionFor(c.caseKey);
  const seg = (val, cls, text) =>
    `<button data-status="${val}" class="${dec.status === val ? 'on ' + cls : ''}">${esc(text)}</button>`;
  root.innerHTML = `
    <div class="action-card">
      <div class="now-what">Now what</div>
      <p class="act-title">${esc(a.title)}</p>
      ${steps ? `<ul>${steps}</ul>` : ''}
      <div class="decision-row">
        <div class="seg" id="dec-seg">
          ${seg('real', 'real', 'Real gap')}
          ${seg('noise', 'noise', 'Noise')}
          ${seg('needs-info', 'needs', 'Needs info')}
        </div>
        <div class="dec-field"><input type="text" id="dec-owner" placeholder="Owner" value="${esc(dec.owner)}"></div>
        <div class="dec-field"><input type="text" id="dec-note" placeholder="Note" value="${esc(dec.note)}"></div>
        <span class="dec-saved" id="dec-saved">${dec.ts ? 'Saved' : ''}</span>
      </div>
    </div>`;
  root.querySelectorAll('#dec-seg button').forEach(b => {
    b.addEventListener('click', () => {
      const cur = decisionFor(c.caseKey).status;
      const next = cur === b.dataset.status ? '' : b.dataset.status;  // toggle off if re-clicked
      saveDecision(c.caseKey, { status: next });
      renderAction(c);
      renderNav(filteredCases());   // repaint the nav dot
    });
  });
  const persist = () => {
    saveDecision(c.caseKey, {
      owner: document.getElementById('dec-owner').value,
      note: document.getElementById('dec-note').value
    });
    document.getElementById('dec-saved').textContent = 'Saved';
  };
  document.getElementById('dec-owner').addEventListener('change', persist);
  document.getElementById('dec-note').addEventListener('change', persist);
}

function entityBox(ent, title) {
  if (!ent) return '';
  const risk = ent.risk || 'N/A';
  return `
    <div class="entity-box">
      <h3>${esc(title)}: ${esc(ent.name || ent.id)}</h3>
      <div class="entity-id">${esc(ent.id || '')}</div>
      <div class="status-line">
        ${chipHtml(risk, riskKind(risk))}
        ${chipHtml('Scope: ' + (ent.inScope || 'No'), ent.inScope === 'Yes' ? 'ok' : 'muted')}
        ${chipHtml('Overdue: ' + (ent.overdue || 'No'), ent.overdue === 'Yes' ? 'gap' : 'muted')}
      </div>
      <div class="metric-grid">
        <div class="metric"><div class="m-label">Leader</div><div class="m-val">${esc(ent.auditLeader || '')}</div></div>
        <div class="metric"><div class="m-label">Business Unit</div><div class="m-val">${esc(ent.businessUnit || '')}</div></div>
        <div class="metric"><div class="m-label">Connectivity</div><div class="m-val">${esc(ent.connectivityTotal || 0)}</div></div>
        <div class="metric"><div class="m-label">Handoffs</div><div class="m-val">${esc(ent.handoffTo || 0)} to / ${esc(ent.handoffFrom || 0)} from</div></div>
      </div>
    </div>`;
}

function renderEvidence(c) {
  const root = document.getElementById('case-evidence');
  if (!c) { root.innerHTML = ''; return; }
  const findingList = (c.findingIds || []).map(id => {
    const f = findingsById[id];
    if (!f) return '';
    return `
      <div class="finding-mini">
        <div class="fm-top">
          <span class="badge ${classKind(f.classification)}">${esc(label(f.classification))}</span>
          <span class="badge info">${esc(reviewKind(f.task).label)}</span>
          ${f.gatePassed ? '' : '<span class="badge doc">Gate flagged</span>'}
          <span class="entity-id">${esc(f.id)}</span>
        </div>
        <div class="fm-reason">${esc(f.reasoning || '')}</div>
      </div>`;
  }).join('');
  root.innerHTML = `
    <details class="evidence">
      <summary>Evidence &amp; entity context (${(c.findingIds || []).length} finding${(c.findingIds || []).length === 1 ? '' : 's'})</summary>
      <div class="evidence-body">
        <div class="evidence-block">
          <h3 class="block-title">Evidence Quote</h3>
          <p class="block-text quote">${esc(c.evidenceQuote || 'Not provided.')}</p>
        </div>
        <div class="evidence-block">
          <h3 class="block-title">Manual Requirement</h3>
          <p class="block-text">${esc(c.manualRequirement || 'Not provided.')}</p>
        </div>
        ${(c.findingIds || []).length ? `<div class="evidence-block"><h3 class="block-title">Underlying findings</h3>${findingList}</div>` : ''}
        ${entityBox(c.source, 'Focal')}
        ${entityBox(c.target, 'Partner')}
      </div>
    </details>`;
}

function syncHash(c) {
  if (!c) return;
  try { history.replaceState(null, '', '#case=' + encodeURIComponent(c.caseKey)); } catch (e) {}
}

function renderGenerated() {
  const gen = DATA.generatedAt ? new Date(DATA.generatedAt).toLocaleString() : '';
  document.getElementById('generated-at').textContent = gen ? `Generated ${gen}` : '';
}

function renderAll() {
  // An external #case= deep link may target a case hidden by the default filter.
  if (externalLoad && state.selectedCaseKey) {
    const c = cases.find(x => x.caseKey === state.selectedCaseKey);
    if (c && state.classification !== 'all' && c.classification !== state.classification) {
      state.classification = 'all';
      classificationFilter.value = 'all';
    }
  }
  const list = filteredCases();
  const current = selectedCase(list);
  externalLoad = false;
  renderCounter(list);
  renderNav(list);
  caseHeadline(current);
  renderStory(current);
  renderAction(current);
  renderEvidence(current);
  syncHash(current);
}

function moveCase(delta) {
  const list = filteredCases();
  if (!list.length) return;
  const idx = Math.max(0, list.findIndex(c => c.caseKey === state.selectedCaseKey));
  const next = (idx + delta + list.length) % list.length;
  state.selectedCaseKey = list[next].caseKey;
  renderAll();
}

function csvEscape(value) {
  return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"';
}
function exportCsv() {
  const list = filteredCases();
  const headers = [
    'Finding ID', 'Case Key', 'Review Kind', 'Requirement Theme', 'Requirement ID',
    'Classification', 'Source ID', 'Source Name',
    'Target ID', 'Target Name', 'Risk Category', 'Key Risks', 'KPAs', 'Covering Controls',
    'Recommended Action', 'Evidence Layer', 'Evidence Quote', 'Reasoning', 'Gate Passed',
    'Decision Status', 'Decision Owner', 'Decision Note', 'Decision Timestamp'
  ];
  let csv = headers.map(csvEscape).join(',') + '\n';
  list.forEach(c => {
    const dec = decisionFor(c.caseKey);
    const keyRisks = (c.keyRisks || []).map(r => r.description && r.description !== r.id ? `${r.id} — ${r.description}` : r.id).join(' | ');
    const kpas = (c.kpas || []).map(k => k.description && k.description !== k.id ? `${k.id} — ${k.description}` : k.id).join(' | ');
    const controls = (c.coveringControls || []).map(ct => `${ct.controlId}: ${ct.title}`).join(' | ');
    const action = (c.recommendedAction || {}).title || '';
    const ids = (c.findingIds && c.findingIds.length) ? c.findingIds : [''];
    ids.forEach(fid => {
      const f = findingsById[fid] || {};
      csv += [
        fid, c.caseKey, reviewKind(c.task).label, reqLabel(c.requirementId), c.requirementId || '',
        c.classification, c.sourceId, c.sourceName,
        c.targetId, c.targetName, c.riskCategory, keyRisks, kpas, controls,
        action, f.evidenceLayer || c.evidenceLayer, f.evidenceQuote || c.evidenceQuote,
        f.reasoning || c.reasoning, (f.gatePassed === false ? 'No' : 'Yes'),
        dec.status, dec.owner, dec.note, dec.ts
      ].map(csvEscape).join(',') + '\n';
    });
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const link = document.createElement('a');
  link.download = 'assurance_caseboard_' + new Date().toISOString().slice(0, 10) + '.csv';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

function applyHashSelection(initial) {
  const m = (location.hash || '').match(/case=([^&]+)/);
  if (!m) return;
  const key = decodeURIComponent(m[1]);
  if (cases.some(c => c.caseKey === key)) {
    state.selectedCaseKey = key;
    if (initial) externalLoad = true;   // only an external load may relax the filter
  }
}

document.getElementById('nav-prev').addEventListener('click', () => moveCase(-1));
document.getElementById('nav-next').addEventListener('click', () => moveCase(1));
document.getElementById('export-csv').addEventListener('click', exportCsv);
document.getElementById('reset-view').addEventListener('click', () => {
  state.classification = defaultClassification;
  state.query = '';
  state.selectedCaseKey = null;
  classificationFilter.value = state.classification;
  searchInput.value = '';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  renderAll();
});
window.addEventListener('hashchange', () => {
  const prev = state.selectedCaseKey;
  applyHashSelection(false);
  if (state.selectedCaseKey !== prev) renderAll();
});

// When embedded in the one-document dashboard, the parent shell pushes the selected
// case here instead of a #case= navigation. Reuse the external-deep-link path so the
// classification filter relaxes for a non-gap case (same as applyHashSelection).
window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'auv:selectCase' && m.caseKey && cases.some(c => c.caseKey === m.caseKey)) {
    state.selectedCaseKey = m.caseKey;
    // Clear any active search so a pushed case is never filtered out of view; externalLoad
    // also relaxes the classification filter (see renderAll). Together they guarantee the
    // pushed case shows even after the user had searched/filtered the list.
    state.query = '';
    searchInput.value = '';
    externalLoad = true;
    renderAll();
  }
});

// In the dashboard drawer (an iframe), render detail-only: the map is the navigator.
if (window.parent !== window) { document.body.classList.add('embedded'); }

initControls();
renderGenerated();
applyHashSelection(true);
renderAll();
// Tell the parent shell (if any) we're ready to receive case selections.
if (window.parent !== window) { try { window.parent.postMessage({ type: 'auv:ready' }, '*'); } catch (e) {} }
</script>
</body>
</html>
